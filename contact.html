<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python - Contacto</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0;">

    <header style="background-color: #306998; color: white; padding: 20px; text-align: center;">
        <h1>Contacto</h1>
        <nav>
            <a href="index.html" style="color: white; margin: 10px;">Inicio</a>
            <a href="about.html" style="color: white; margin: 10px;">Acerca de</a>
            <a href="contact.html" style="color: white; margin: 10px;">Contacto</a>
        </nav>
    </header>

    <main style="padding: 30px; max-width: 600px; margin: auto;">
        <h2>Contáctanos</h2>
        <p>Si quieres aprender más sobre Python, puedes enviarnos un mensaje.</p>

        <form>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre"
                   style="width: 100%; padding: 8px; margin: 8px 0;">

            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email"
                   style="width: 100%; padding: 8px; margin: 8px 0;">

            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="5"
                      style="width: 100%; padding: 8px; margin: 8px 0;"></textarea>

            <button type="submit"
                    style="background-color: #306998; color: white; padding: 10px 20px; border: none;">
                Enviar
            </button>
        </form>
    </main>

    <footer style="background-color: #ffd43b; padding: 15px; text-align: center;">
        <p>© 2026 Sitio sobre Python</p>
    </footer>

</body>
</html>
